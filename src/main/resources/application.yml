server:
  port: 8080
spring:
  application:
    name: enterprise-texting-gateway
  profiles:
    active: ${APP_PROFILE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/etg}
    username: ${SPRING_DATASOURCE_USERNAME:etg}
    password: ${SPRING_DATASOURCE_PASSWORD:etg}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
etg:
  messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
